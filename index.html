<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Face Breakout</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <h1>🧿 Face Breakout</h1>
      <p class="description">눈에서 생성된 검은 공을 아랫입술 패들로 튕겨 얼굴 구멍에 넣으세요.</p>

      <section class="toolbar">
        <button id="restart">다시 시작</button>
      </section>

      <canvas id="game" width="720" height="960" aria-label="Face Breakout 게임 화면"></canvas>

      <section class="hud">
        <p id="status">로딩 중...</p>
        <p id="level">Level 1</p>
      </section>
    </main>

    <script src="game.js"></script>
  </body>
</html>
